# Radar GOULLART: baixa a foto original do anúncio e gera a arte com ela.
# A conversa do Radar não consegue baixar fotos (rede bloqueada); o GitHub consegue.
# Entrada: fila/RADAR-AAMMDD-NN.json na branch radar-fila, com
#   { codigo, titulo, ano, horas, precoSite, local, fotoUrls [até 3] }   (só dados públicos)
# Saída: RADAR-AAMMDD-NN.png (arte) e RADAR-AAMMDD-NN-foto1/2/3.<ext> (fotos originais) na branch radar-artes.
name: Radar - arte com foto original

on:
  push:
    branches: [radar-fila]
    paths: ["fila/*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-arte
  cancel-in-progress: false

jobs:
  arte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar navegador para a arte
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Baixar fotos e gerar artes
        run: |
          set -euo pipefail
          git config user.name "Radar GOULLART"
          git config user.email "radar@goullart.invalid"
          mkdir -p /tmp/saida
          shopt -s nullglob
          processados=()
          for pedido in fila/RADAR-*.json; do
            codigo=$(basename "$pedido" .json)
            # Um pedido com problema vai para fila/erro e não trava os outros.
            # fotoUrls (até 3) ou fotoUrl (uma): a primeira vira a foto da arte; todas vão para radar-artes como -foto1/2/3.
            if ! urls=$(node -e 'const d=require(process.argv[1]);const l=[...(Array.isArray(d.fotoUrls)?d.fotoUrls:[]),...(d.fotoUrl?[d.fotoUrl]:[])].filter(Boolean).slice(0,3);process.stdout.write(l.join("\n"))' "$PWD/$pedido"); then
              echo "::warning::$codigo: JSON inválido; movido para fila/erro"; mkdir -p fila/erro; git mv -f "$pedido" fila/erro/; continue
            fi
            dados=/tmp/$codigo.json
            node -e 'const f=require("fs"),[o,p]=process.argv.slice(1);const d=JSON.parse(f.readFileSync(o));delete d.fotoUrl;delete d.fotoUrls;f.writeFileSync(p,JSON.stringify(d))' "$pedido" "$dados"
            n=0
            while IFS= read -r url; do
              [ -n "$url" ] || continue
              n=$((n+1))
              ext=$(printf '%s' "$url" | sed -E 's/[?#].*//; s/.*\.([A-Za-z0-9]{3,4})$/\1/' | tr 'A-Z' 'a-z')
              case "$ext" in jpg|jpeg|png|webp) ;; *) ext=jpg ;; esac
              foto=/tmp/saida/$codigo-foto$n.$ext
              # Só https: nada de file:// ou outros esquemas que leriam arquivos do próprio GitHub.
              if curl -fsSL --proto =https --proto-redir =https --max-time 60 --max-filesize 15000000 -A "Mozilla/5.0" -o "$foto" "$url"; then
                if [ "$n" = 1 ]; then node -e 'const f=require("fs"),[p,foto]=process.argv.slice(1);const d=JSON.parse(f.readFileSync(p));d.foto=foto;f.writeFileSync(p,JSON.stringify(d))' "$dados" "$foto"; fi
              else
                echo "::warning::$codigo: foto $n não baixou"
                rm -f "$foto"
              fi
            done <<< "$urls"
            if ! node scripts/radar/arte.mjs "$dados" "/tmp/saida/$codigo.png"; then
              echo "::warning::$codigo: arte falhou; movido para fila/erro"
              rm -f /tmp/saida/"$codigo"*; mkdir -p fila/erro; git mv -f "$pedido" fila/erro/; continue
            fi
            git rm -q "$pedido"
            processados+=("$codigo")
          done
          if [ -n "$(ls /tmp/saida)" ]; then
            # Primeiro grava as artes; só depois tira os pedidos da fila (nada se perde se um envio falhar).
            if git fetch -q origin radar-artes; then git worktree add -q /tmp/artes origin/radar-artes; else git worktree add -q --orphan -b radar-artes /tmp/artes; fi
            cp /tmp/saida/* /tmp/artes/
            git -C /tmp/artes add RADAR-*
            git -C /tmp/artes commit -q -m "Radar: artes ${processados[*]}"
            git -C /tmp/artes push -q origin HEAD:radar-artes
          fi
          if git diff --cached --quiet; then echo "Fila vazia"; exit 0; fi
          git commit -q -m "Radar: fila processada" && git push -q origin HEAD:radar-fila
