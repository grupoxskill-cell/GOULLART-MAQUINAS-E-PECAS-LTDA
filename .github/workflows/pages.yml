# Publica a versão estática do site (catálogo + WhatsApp) no GitHub Pages a cada push no master.
name: Publicar site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    if: github.ref == 'refs/heads/master'
    # Um único escritor em gh-pages; não interromper um push em andamento.
    concurrency:
      group: goullart-gh-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A fila pode receber eventos fora de ordem ou reexecuções antigas.
          ref: master
          # O token de escrita não fica em .git enquanto o build e os testes rodam código do repositório.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar site estático para validação
        run: node scripts/build.mjs
      - name: Rodar testes (nada vai ao ar com teste quebrado)
        run: npm test
      - name: Conferir versão antes de publicar
        id: versao
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          local_sha=$(git rev-parse HEAD)
          # Token só neste comando (continua funcionando quando o repositório ficar privado).
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          remote_ref=$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" ls-remote --exit-code origin refs/heads/master)
          remote_sha=${remote_ref%%$'\t'*}
          echo "sha=$local_sha" >> "$GITHUB_OUTPUT"
          if [[ "$local_sha" == "$remote_sha" ]]; then
            echo "atual=true" >> "$GITHUB_OUTPUT"
          else
            echo "atual=false" >> "$GITHUB_OUTPUT"
            echo "::notice::master foi atualizado durante o build; envio antigo ignorado."
          fi
      - name: Publicar versão atual
        if: steps.versao.outputs.atual == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          full_commit_message: 'deploy: ${{ steps.versao.outputs.sha }}'
