# Atualiza a cópia pública em uma branch; a publicação acontece somente após juntar no master.
# Segurança: o código baixado do site do ChatGPT roda (testes e build) num job SEM permissão de escrita
# e sem token no .git. Só o segundo job grava, e ele não executa nada do que foi baixado.
name: Importar site do ChatGPT
on:
  push:
    branches: ["importar-chatgpt", "importar-chatgpt-*"]
    paths: [".github/workflows/importar-chatgpt.yml", "scripts/espelhar-chatgpt.mjs", "scripts/preparar-espelho.mjs"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: importar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Nunca gravar direto no master
        # Código copiado de um site de terceiros só entra no master por PR revisado.
        run: |
          case "$GITHUB_REF_NAME" in importar-chatgpt|importar-chatgpt-*) ;; *) echo "::error::Rode este fluxo numa branch importar-chatgpt-*, nunca em $GITHUB_REF_NAME."; exit 1;; esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/espelhar-chatgpt.mjs https://catalogo-goullart-pesados-brasil.fitbun9.chatgpt.site
      - run: npm test
      - run: npm run build
      - name: Verificar páginas exportadas
        run: |
          test -s _site/index.html
          test -s _site/ofertas/index.html
          test -s _site/maquinas/escavadeira/index.html
          test -s _site/maquinas/pa-carregadeira/index.html
          test -s _site/texas/index.html
          test -s _site/texas/botas-cano-alto-texas.jpg
          test -s _site/assets/fonts/montserrat-latin-variable.woff2
      - uses: actions/upload-artifact@v4
        with:
          name: espelho
          path: espelho/
          include-hidden-files: true
          retention-days: 1

  gravar:
    needs: importar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Nunca gravar direto no master
        run: |
          case "$GITHUB_REF_NAME" in importar-chatgpt|importar-chatgpt-*) ;; *) echo "::error::Branch não permitida: $GITHUB_REF_NAME."; exit 1;; esac
      - uses: actions/checkout@v4
      - run: rm -rf espelho
      - uses: actions/download-artifact@v4
        with:
          name: espelho
          path: espelho/
      - name: Salvar cópia na branch (sem executar nada do que foi baixado)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A espelho
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza catálogo público para o domínio GOULLART"
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
